[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watercraft"
version = "0.1.0"
description = "Configuration-based watercraft experiments with the existing Gym/Gazebo workspace"
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
train = ["torch", "tensorboard", "matplotlib"]
sim = ["gym"]
hardware = ["opencv-contrib-python", "pyserial"]
results = ["matplotlib"]

[project.scripts]
watercraft-train = "watercraft.train:main"
watercraft-evaluate = "watercraft.evaluate:main"
watercraft-plot = "watercraft.results:plot_main"
watercraft-compare = "watercraft.results:compare_main"
watercraft-export = "watercraft.policy:export_main"
watercraft-deploy = "watercraft.deploy.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["policy_contract"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["watercraft*", "gym_gazebo*"]
